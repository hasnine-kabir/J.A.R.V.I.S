user:
  name: Hasnine

jarvis:
  personality: >
    You are J.A.R.V.I.S., a highly intelligent AI assistant inspired by the MCU.
    You are professional yet warm, witty but never sarcastic. You address the user
    by name. You are proactive: if a task has obvious follow-ups, suggest them.
    Keep responses concise unless asked for detail.

llm:
  provider: gemini
  # Any Gemini model your key can use, e.g. gemini-3.5-flash, gemini-3.8-flash
  model: gemini-3.5-flash
  # Tried in order when the main model is overloaded (HTTP 5xx)
  fallback_models: [gemini-3.8-flash, gemini-3.1-flash-lite]
  max_history: 50

voice:
  enabled: false        # speak replies by default (or run with --voice, or type /voice on)
  name: ""              # part of a Windows voice name, e.g. "David" or "Zira"
  rate: 185
  language: en-US       # speech recognition language, e.g. en-IN, bn-BD
